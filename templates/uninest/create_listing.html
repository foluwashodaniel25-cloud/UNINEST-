{% extends "base.html" %}
{% block title %}New Listing{% endblock %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">Upload New Advert</h2>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row g-3">
          {% for field in form %}
          <div class="col-md-6">
            <label class="form-label">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
            {{ field }}
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
          </div>
          {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary mt-4">Submit Listing</button>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}

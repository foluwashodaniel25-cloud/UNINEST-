{% extends "base.html" %}
{% load static %}

{% block title %}Unlock UNINEST{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card shadow-sm">
    <div class="card-body text-center p-4">
      <h4 class="fw-bold mb-2">Unlock Full Access</h4>
      <p class="text-secondary mb-4">
        ₦{{ amount }}/month unlocks verified contacts, agent details, and priority listings.
      </p>

      <button
        id="payBtn"
        class="btn btn-warning btn-lg w-100 text-dark fw-semibold"
        data-amount-kobo="{{ amount_kobo }}"
        data-reference="{{ reference }}"
        data-customer-name="{{ customer_name }}"
        data-customer-email="{{ customer_email }}"
        data-public-key="{{ paystack_public_key }}"
        data-verify-url="{% url 'verify_payment' %}"
        data-dashboard-url="{% url 'dashboard' %}"
      >
        Pay ₦{{ amount }} with Paystack
      </button>

      <div id="payStatus" class="mt-3 small"></div>
    </div>
  </div>
</div>

<script src="https://js.paystack.co/v1/inline.js"></script>
<script>
  (function () {
    var payBtn = document.getElementById("payBtn");
    var statusEl = document.getElementById("payStatus");

    // All Django-rendered values come from data-* attributes, not
    // inline template tags, so this file is plain, lint-clean JS.
    var cfg = {
      amountKobo: Number(payBtn.dataset.amountKobo),
      reference: payBtn.dataset.reference,
      customerName: payBtn.dataset.customerName,
      customerEmail: payBtn.dataset.customerEmail,
      publicKey: payBtn.dataset.publicKey,
      verifyUrl: payBtn.dataset.verifyUrl,
      dashboardUrl: payBtn.dataset.dashboardUrl,
    };
    var originalLabel = payBtn.textContent;

    function getCookie(name) {
      var match = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
      return match ? match.pop() : "";
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = "mt-3 small " + (isError ? "text-danger" : "text-success");
    }

    function resetButton() {
      payBtn.disabled = false;
      payBtn.textContent = originalLabel;
    }

    function confirmWithServer() {
      // Never trust the browser callback alone -- ask our own server to
      // re-verify the transaction with Paystack before unlocking anything.
      fetch(cfg.verifyUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        body: JSON.stringify({ reference: cfg.reference }),
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data.ok) {
            setStatus("Payment confirmed! Redirecting…", false);
            setTimeout(function () {
              window.location.href = cfg.dashboardUrl;
            }, 1200);
          } else {
            setStatus("We couldn't confirm this payment: " + (data.error || "unknown error"), true);
            resetButton();
          }
        })
        .catch(function () {
          setStatus("Network error while confirming payment. Please contact support with your reference: " + cfg.reference, true);
          resetButton();
        });
    }

    payBtn.addEventListener("click", function () {
      payBtn.disabled = true;
      payBtn.textContent = "Opening secure checkout…";

      var handler = PaystackPop.setup({
        key: cfg.publicKey,
        email: cfg.customerEmail,
        amount: cfg.amountKobo,
        currency: "NGN",
        ref: cfg.reference,
        metadata: {
          custom_fields: [
            { display_name: "Customer Name", variable_name: "customer_name", value: cfg.customerName }
          ]
        },
        callback: function () {
          setStatus("Verifying payment…", false);
          confirmWithServer();
        },
        onClose: function () {
          resetButton();
        },
      });

      handler.openIframe();
    });
  })();
</script>
{% endblock %}
